name: Set up repository
description: Install the pinned package manager, Vite+, and workspace dependencies.

inputs:
  cache:
    description: Whether setup-vp should restore and save its dependency cache.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.cache }}
        run-install: |
          args: ['--frozen-lockfile']
